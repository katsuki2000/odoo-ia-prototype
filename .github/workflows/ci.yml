name: Python Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clone Odoo 17 core sources
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch 17.0 https://github.com/odoo/odoo.git ../odoo-17.0
          git -C ../odoo-17.0 sparse-checkout set odoo

      - name: Run offline test suite
        run: |
          pytest -q -m "not integration"
