version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ÉTAGE IA : Base de données vectorielle privée et API RAG
  miro_rag:
    build:
      context: ../
      dockerfile: miro-rag/Dockerfile
    working_dir: /app/miro-rag
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/app/miro-rag/vectorstore/chroma_db
      - chromacache:/root/.cache
      - ../miro-rag/fake_data:/app/fake_data
      - ../miro-rag/ingestion/logs:/app/ingestion/logs
    env_file:
      - ../miro-rag/.env
    environment:
      - OMP_NUM_THREADS=1

  odoo:
    image: odoo:17.0
    depends_on:
      - db
      - miro_rag
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
    command: --dev=all --proxy-mode

volumes:
  pgdata:
  odoo-data:
  chromadata:
  chromacache: