version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ÉTAGE IA : Base de données vectorielle privée
  #chromadb:
  #  image: chromadb/chroma:0.4.24
  #  ports:
  #    - "8000:8000"
  #  volumes:
  #    - chromadata:/chroma/data
  #  environment:
  #    - IS_PERSISTENT=TRUE

  odoo:
    image: odoo:17.0
    depends_on:
      - db
      #- chromadb
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
    command: --dev=all --proxy-mode

volumes:
  pgdata:
  odoo-data:
  chromadata: