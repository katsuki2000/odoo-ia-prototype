rules:
  - id: odoo-raw-sql-unique-index
    languages: [python]
    severity: INFO
    message: >
      Raw SQL CREATE UNIQUE INDEX executed directly via a .execute(...)
      call (e.g. self.env.cr.execute("""CREATE UNIQUE INDEX ...""") inside
      _auto_init()/init()). This is a DB-level uniqueness mechanism that
      never appears as a _sql_constraints declaration
      (odoo-sql-constraints-declaration) nor as an @api.constrains Python
      method -- flagged separately so analyze_data_constraints does not
      report "no uniqueness rule found"/leave the LLM to invent one when
      this raw-SQL mechanism is the real (and only) answer. Concrete case
      that motivated this rule: account.move's 'name' uniqueness is
      enforced this way (account_move_unique_name index), not by its
      _sql_constraints entry (deliberately an empty SQL string) nor by
      any @api.constrains method.
    patterns:
      - pattern: $CR.execute($SQL)
      - metavariable-regex:
          metavariable: $SQL
          regex: (?is).*CREATE\s+UNIQUE\s+INDEX.*

    # - matche un appel `<expr>.execute(<un seul argument>)` dont le texte
    #   source de cet argument contient (n'importe ou, insensible a la
    #   casse, y compris a travers les retours a la ligne) "CREATE UNIQUE
    #   INDEX" -- couvre le cas reel (chaine triple-guillemets multi-
    #   lignes passee a self.env.cr.execute(...)). NOTE : metavariable-
    #   regex de Semgrep matche le texte ENTIER de la valeur (ancrage
    #   implicite, comme re.fullmatch) -- d'ou le `.*...*` autour du motif
    #   et le flag `s` (DOTALL) pour que `.` traverse les retours a la
    #   ligne ; verifie empiriquement (une regex nue sans ces deux ajouts
    #   ne matchait aucun cas reel, y compris mono-ligne).
    # - ne matche PAS un .execute(...) dont l'argument ne contient pas ce
    #   texte (ex: CREATE INDEX simple, ou un .execute() sans rapport avec
    #   SQL comme wizard.execute()) : le metavariable-regex ne trouve rien
    #   a matcher sur un nom de variable ou un texte SQL different.
    # - gap connu et documente, pas un defaut silencieux : un .execute()
    #   a 2 arguments positionnels (requete + parametres, cr.execute(q, p))
    #   ne matche PAS non plus (pattern exige exactement un argument) --
    #   hors du perimetre de ce cas precis, a etendre si le benchmark
    #   adversarial en revele le besoin.

  - id: odoo-create-unique-index-helper
    languages: [python]
    severity: INFO
    message: >
      odoo.tools.sql.create_unique_index() helper call detected -- same
      DB-level uniqueness family as odoo-raw-sql-unique-index, expressed
      via the higher-level helper instead of a raw execute() string.
    patterns:
      - pattern-either:
          - pattern: create_unique_index(...)
          - pattern: $MOD.create_unique_index(...)

    # - matche un appel a la fonction `create_unique_index` (import direct
    #   ou qualifie par un module, ex: `sql.create_unique_index(...)`).
    # - ne matche PAS `create_index(...)` (l'helper NON-unique, nom de
    #   fonction different, comparaison exacte).
