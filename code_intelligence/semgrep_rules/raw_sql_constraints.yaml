rules:
  - id: odoo-raw-sql-unique-index
    languages: [python]
    severity: INFO
    message: >
      Raw SQL CREATE UNIQUE INDEX executed directly via a .execute(...)
      call (e.g. self.env.cr.execute("""CREATE UNIQUE INDEX ...""") inside
      _auto_init()/init()). This DB-level uniqueness mechanism does not
      appear in _sql_constraints or @api.constrains methods.
    patterns:
      - pattern: $CR.execute($SQL)
      - metavariable-regex:
          metavariable: $SQL
          regex: (?is).*CREATE\s+UNIQUE\s+INDEX.*

  - id: odoo-create-unique-index-helper
    languages: [python]
    severity: INFO
    message: >
      odoo.tools.sql.create_unique_index() helper call detected -- DB-level
      uniqueness declared via the helper instead of a raw SQL string.
    patterns:
      - pattern-either:
          - pattern: create_unique_index(...)
          - pattern: $MOD.create_unique_index(...)

